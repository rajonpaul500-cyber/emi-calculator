<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMI Calculator - Loan Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>EMI Calculator</h1>
    <p class="subtitle">Calculate your monthly loan installment instantly</p>

    <section class="calculator">
      <div class="inputs">
        <div class="input-group">
          <label for="loanAmount">Loan Amount (Rs)</label>
          <input type="number" id="loanAmount" value="500000" min="0" step="10000">
          <input type="range" id="loanAmountRange" min="10000" max="10000000" step="10000" value="500000">
        </div>

        <div class="input-group">
          <label for="interestRate">Interest Rate (% per annum)</label>
          <input type="number" id="interestRate" value="8.5" min="0" max="30" step="0.1">
          <input type="range" id="interestRateRange" min="1" max="30" step="0.1" value="8.5">
        </div>

        <div class="input-group">
          <label for="loanTenure">Loan Tenure (years)</label>
          <input type="number" id="loanTenure" value="5" min="1" max="30" step="1">
          <input type="range" id="loanTenureRange" min="1" max="30" step="1" value="5">
        </div>
      </div>

      <div class="result">
        <h2>Monthly EMI</h2>
        <p id="emi" class="emi">Rs 0</p>
        <p id="totalPayment" class="total">Total Payment: Rs 0</p>
        <p id="totalInterest" class="total">Total Interest: Rs 0</p>
      </div>
    </section>

    <section class="breakdown">
      <h2>Payment Breakdown</h2>
      <div class="bar">
        <div id="principalBar" class="principal-bar"></div>
        <div id="interestBar" class="interest-bar"></div>
      </div>
      <div class="legend">
        <span class="legend-item principal"><span class="dot"></span> Principal: <strong id="legendPrincipal">Rs 0</strong></span>
        <span class="legend-item interest"><span class="dot"></span> Interest: <strong id="legendInterest">Rs 0</strong></span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
